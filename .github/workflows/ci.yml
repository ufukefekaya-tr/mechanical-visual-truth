name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native rendering runtime
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 xvfb
      - name: Install
        run: python -m pip install -e '.[dev]' build
      - name: Test CAD, MCP and isolation boundaries
        run: xvfb-run -a python -m pytest
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed resources outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -I -m mvt.cli.main project init ./wheel-smoke --template linear-actuator --json
          python -I -m mvt.cli.main contract validate ./wheel-smoke --json
          python -I -m mvt.cli.main build ./wheel-smoke --json
